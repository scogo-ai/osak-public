name: ${OSAK_LOCAL_COMPOSE_PROJECT:-osak-local}

x-app-environment: &app-environment
  OSAK_ENV: ${OSAK_ENV:-local}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-osak}:${POSTGRES_PASSWORD:-osak}@postgres:5432/${POSTGRES_DB:-osak}}
  OSAK_DATA_DIR: ${OSAK_DATA_DIR:-/var/lib/osak/data}
  OSAK_WORKER_HEARTBEAT_FILE: ${OSAK_WORKER_HEARTBEAT_FILE:-/var/lib/osak/data/worker-heartbeat}
  OSAK_PUBLIC_BASE_URL: ${OSAK_PUBLIC_BASE_URL:-http://127.0.0.1:${OSAK_API_PORT:-8000}}
  OSAK_KEY_PEPPER: ${OSAK_KEY_PEPPER:-local-only-change-me}
  OSAK_ORIGIN_SHARED_SECRET: ${OSAK_ORIGIN_SHARED_SECRET:-}
  OSAK_ADMIN_ACCESS_TOKEN: ${OSAK_ADMIN_ACCESS_TOKEN:-local-admin-token}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-mailpit}
  MAILPIT_API_URL: ${MAILPIT_API_URL:-http://mailpit:8025}
  OSAK_EMAIL_FROM: ${OSAK_EMAIL_FROM:-OSAK Local <osak@localhost>}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-false}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.6-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osak}
      POSTGRES_USER: ${POSTGRES_USER:-osak}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-osak}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    restart: unless-stopped

  migrate:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        BUILD_VERSION: ${OSAK_BUILD_VERSION:-local}
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app-data:/var/lib/osak/data
    command:
      - /bin/sh
      - -ec
      - |
        alembic upgrade head
    restart: "no"
    init: true

  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      args:
        BUILD_VERSION: ${OSAK_BUILD_VERSION:-local}
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:${OSAK_API_PORT:-8000}:8000"
    volumes:
      - app-data:/var/lib/osak/data
    init: true
    restart: unless-stopped

  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
      args:
        BUILD_VERSION: ${OSAK_BUILD_VERSION:-local}
        GOCSAF_VERSION: ${GOCSAF_VERSION:-v3.7.1}
    environment:
      <<: *app-environment
      NVD_API_KEY: ${NVD_API_KEY:-}
      OSAK_CISCO_CHECKER_QUERIES: ${OSAK_CISCO_CHECKER_QUERIES:-[]}
      CISCO_CLIENT_ID: ${CISCO_CLIENT_ID:-}
      CISCO_CLIENT_SECRET: ${CISCO_CLIENT_SECRET:-}
      OSAK_ENABLED_SOURCES: ${OSAK_ENABLED_SOURCES:-}
      OSAK_DISABLED_SOURCES: ${OSAK_DISABLED_SOURCES:-}
      OSAK_REVIEWED_SOURCE_ALLOWLIST: ${OSAK_REVIEWED_SOURCE_ALLOWLIST:-}
      INGEST_ENABLED: ${INGEST_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - app-data:/var/lib/osak/data
    init: true
    restart: unless-stopped

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.21.8}
    environment:
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-5000}
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mailpit-data:/data
    ports:
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    restart: unless-stopped

volumes:
  postgres-data:
  app-data:
  mailpit-data:
