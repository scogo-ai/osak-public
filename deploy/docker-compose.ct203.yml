# CT 203 host-network profile.
#
# Proxmox's unprivileged CT cannot attach the Docker bridge under its current
# AppArmor policy. Keep the normal bridge Compose files unchanged and use this
# override only inside CT 203:
#
#   docker compose --env-file /opt/osak/.env \
#     -f deploy/docker-compose.prod.yml \
#     -f deploy/docker-compose.ct203.yml \
#     -p osak-ct203 up -d
#
# Every listener is explicitly loopback-bound in the guest. cloudflared is
# opt-in (`--profile public`) so local validation never publishes the service.

services:
  postgres:
    network_mode: host
    ports: !reset []
    environment:
      POSTGRES_PORT: ${OSAK_CT_POSTGRES_PORT:-5433}
    command:
      - postgres
      - -c
      - listen_addresses=127.0.0.1
      - -c
      - port=${OSAK_CT_POSTGRES_PORT:-5433}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p $${POSTGRES_PORT} -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]

  migrate:
    image: ${OSAK_CT_API_IMAGE:-osak-ct203-api:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      network: host
      args:
        BUILD_VERSION: ${OSAK_CT_BUILD_VERSION:-ct203}
    network_mode: host
    environment:
      OSAK_ENV: local
      DATABASE_URL: ${OSAK_CT_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-osak}:${POSTGRES_PASSWORD:-osak}@127.0.0.1:${OSAK_CT_POSTGRES_PORT:-5433}/${POSTGRES_DB:-osak}}

  api:
    image: ${OSAK_CT_API_IMAGE:-osak-ct203-api:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.api
      network: host
      args:
        BUILD_VERSION: ${OSAK_CT_BUILD_VERSION:-ct203}
    network_mode: host
    ports: !reset []
    command:
      - uvicorn
      - osak.api.app:app
      - --host
      - 127.0.0.1
      - --port
      - ${OSAK_CT_API_PORT:-8000}
      - --no-access-log
    environment:
      OSAK_ENV: local
      DATABASE_URL: ${OSAK_CT_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-osak}:${POSTGRES_PASSWORD:-osak}@127.0.0.1:${OSAK_CT_POSTGRES_PORT:-5433}/${POSTGRES_DB:-osak}}
      OSAK_PUBLIC_BASE_URL: ${OSAK_CT_PUBLIC_BASE_URL:-http://127.0.0.1:8000}
      EMAIL_BACKEND: mailpit
      MAILPIT_API_URL: http://127.0.0.1:${OSAK_CT_MAILPIT_UI_PORT:-8025}
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: ${OSAK_CT_MAILPIT_SMTP_PORT:-1025}
      SMTP_STARTTLS: "false"
      RESEND_API_KEY: ""
      TURNSTILE_SECRET_KEY: ""
    depends_on:
      mailpit:
        condition: service_healthy

  worker:
    image: ${OSAK_CT_WORKER_IMAGE:-osak-ct203-worker:local}
    build:
      context: ..
      dockerfile: deploy/Dockerfile.worker
      network: host
      args:
        BUILD_VERSION: ${OSAK_CT_BUILD_VERSION:-ct203}
        GOCSAF_VERSION: ${GOCSAF_VERSION:-v3.7.1}
    network_mode: host
    environment:
      OSAK_ENV: local
      DATABASE_URL: ${OSAK_CT_DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:-osak}:${POSTGRES_PASSWORD:-osak}@127.0.0.1:${OSAK_CT_POSTGRES_PORT:-5433}/${POSTGRES_DB:-osak}}
      MAILPIT_API_URL: http://127.0.0.1:${OSAK_CT_MAILPIT_UI_PORT:-8025}
      SMTP_HOST: 127.0.0.1
      SMTP_PORT: ${OSAK_CT_MAILPIT_SMTP_PORT:-1025}
      SMTP_STARTTLS: "false"
      RESEND_API_KEY: ""
      TURNSTILE_SECRET_KEY: ""
    depends_on:
      mailpit:
        condition: service_healthy

  backup:
    network_mode: host
    environment:
      PGHOST: 127.0.0.1
      PGPORT: ${OSAK_CT_POSTGRES_PORT:-5433}

  mailpit:
    image: ${MAILPIT_IMAGE:-axllent/mailpit:v1.21.8}
    network_mode: host
    ports: !reset []
    environment:
      MP_MAX_MESSAGES: ${MAILPIT_MAX_MESSAGES:-5000}
      MP_DATABASE: /data/mailpit.db
    command:
      - --listen
      - 127.0.0.1:${OSAK_CT_MAILPIT_UI_PORT:-8025}
      - --smtp
      - 127.0.0.1:${OSAK_CT_MAILPIT_SMTP_PORT:-1025}
      - --max
      - ${MAILPIT_MAX_MESSAGES:-5000}
      - --database
      - /data/mailpit.db
    volumes:
      - mailpit-data:/data
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 5s

  cloudflared:
    profiles: [public]
    network_mode: host
    depends_on:
      tunnel-catchall:
        condition: service_started
    command:
      - tunnel
      - --no-autoupdate
      - --loglevel
      - info
      - run
      - --url
      - http://127.0.0.1:${OSAK_CT_TUNNEL_CATCHALL_PORT:-18080}

  tunnel-catchall:
    image: ${OSAK_CT_API_IMAGE:-osak-ct203-api:local}
    profiles: [public]
    network_mode: host
    command:
      - python
      - -c
      - >-
        from http.server import BaseHTTPRequestHandler,HTTPServer;
        H=type('H',(BaseHTTPRequestHandler,),{
        'do_GET':lambda s:(s.send_response(404),s.end_headers()),
        'do_HEAD':lambda s:(s.send_response(404),s.end_headers()),
        'do_POST':lambda s:(s.send_response(404),s.end_headers()),
        'do_PUT':lambda s:(s.send_response(404),s.end_headers()),
        'do_DELETE':lambda s:(s.send_response(404),s.end_headers()),
        'do_OPTIONS':lambda s:(s.send_response(404),s.end_headers()),
        'log_message':lambda *args:None});
        HTTPServer(('127.0.0.1',${OSAK_CT_TUNNEL_CATCHALL_PORT:-18080}),H).serve_forever()

volumes:
  mailpit-data:
