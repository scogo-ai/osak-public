name: ${OSAK_PROD_COMPOSE_PROJECT:-osak-prod}

x-app-environment: &app-environment
  OSAK_ENV: ${OSAK_ENV:-production}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  DATABASE_URL: ${DATABASE_URL:-postgresql+psycopg://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-osak}}
  OSAK_DATA_DIR: ${OSAK_DATA_DIR:-/var/lib/osak/data}
  OSAK_WORKER_HEARTBEAT_FILE: ${OSAK_WORKER_HEARTBEAT_FILE:-/var/lib/osak/data/worker-heartbeat}
  OSAK_PUBLIC_BASE_URL: ${OSAK_PUBLIC_BASE_URL:?set OSAK_PUBLIC_BASE_URL}
  OSAK_KEY_PEPPER: ${OSAK_KEY_PEPPER:?set OSAK_KEY_PEPPER}
  OSAK_ORIGIN_SHARED_SECRET: ${OSAK_ORIGIN_SHARED_SECRET:?set OSAK_ORIGIN_SHARED_SECRET}
  OSAK_ADMIN_ACCESS_TOKEN: ${OSAK_ADMIN_ACCESS_TOKEN:?set OSAK_ADMIN_ACCESS_TOKEN}
  EMAIL_BACKEND: ${EMAIL_BACKEND:-resend}
  MAILPIT_API_URL: ${MAILPIT_API_URL:-}
  OSAK_EMAIL_FROM: ${OSAK_EMAIL_FROM:?set OSAK_EMAIL_FROM}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_STARTTLS: ${SMTP_STARTTLS:-true}
  RESEND_API_KEY: ${RESEND_API_KEY:?set RESEND_API_KEY}
  TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-postgres:16.6-alpine}
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-osak}
      POSTGRES_USER: ${POSTGRES_USER:?set POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

  migrate:
    image: ${OSAK_API_IMAGE:?set OSAK_API_IMAGE}:${OSAK_IMAGE_TAG:?set OSAK_IMAGE_TAG}
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app-data:/var/lib/osak/data
    command:
      - /bin/sh
      - -ec
      - |
        alembic upgrade head
    restart: "no"
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  api:
    image: ${OSAK_API_IMAGE:?set OSAK_API_IMAGE}:${OSAK_IMAGE_TAG:?set OSAK_IMAGE_TAG}
    environment:
      <<: *app-environment
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - app-data:/var/lib/osak/data
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  worker:
    image: ${OSAK_WORKER_IMAGE:?set OSAK_WORKER_IMAGE}:${OSAK_IMAGE_TAG:?set OSAK_IMAGE_TAG}
    environment:
      <<: *app-environment
      OSAK_CVE_BASELINE_ARCHIVE: /var/lib/osak/data/baselines/cvelistv5-latest.zip
      NVD_API_KEY: ${NVD_API_KEY:-}
      OSAK_CISCO_CHECKER_QUERIES: ${OSAK_CISCO_CHECKER_QUERIES:-[]}
      CISCO_CLIENT_ID: ${CISCO_CLIENT_ID:-}
      CISCO_CLIENT_SECRET: ${CISCO_CLIENT_SECRET:-}
      OSAK_ENABLED_SOURCES: ${OSAK_ENABLED_SOURCES:-}
      OSAK_DISABLED_SOURCES: ${OSAK_DISABLED_SOURCES:-}
      OSAK_REVIEWED_SOURCE_ALLOWLIST: ${OSAK_REVIEWED_SOURCE_ALLOWLIST:-}
      INGEST_ENABLED: ${INGEST_ENABLED:-true}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    volumes:
      - app-data:/var/lib/osak/data
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  backup:
    image: ${POSTGRES_IMAGE:-postgres:16.6-alpine}
    environment:
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-osak}
      PGUSER: ${POSTGRES_USER:?set POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      BACKUP_INTERVAL_SECONDS: ${BACKUP_INTERVAL_SECONDS:-86400}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backup-data:/backups
    command:
      - /bin/sh
      - -ec
      - |
        umask 077
        while :; do
          stamp="$$(date -u +%Y%m%dT%H%M%SZ)"
          target="/backups/osak-$${stamp}.dump"
          if pg_dump --format=custom --no-owner --file="$${target}"; then
            sha256sum "$${target}" > "$${target}.sha256"
            find /backups -type f -name 'osak-*.dump' -mtime +"$${BACKUP_RETENTION_DAYS}" -delete
            find /backups -type f -name 'osak-*.dump.sha256' -mtime +"$${BACKUP_RETENTION_DAYS}" -delete
          else
            echo "OSAK database backup failed" >&2
          fi
          sleep "$${BACKUP_INTERVAL_SECONDS}"
        done
    init: true
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

  cloudflared:
    image: ${CLOUDFLARED_IMAGE:-cloudflare/cloudflared:2025.11.1}
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARED_TUNNEL_TOKEN:?set CLOUDFLARED_TUNNEL_TOKEN}
    command:
      - tunnel
      - --no-autoupdate
      - run
      - --loglevel
      - warn
    depends_on:
      api:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:mode=1777,noexec,nosuid
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    restart: unless-stopped

volumes:
  postgres-data:
  app-data:
  backup-data:
